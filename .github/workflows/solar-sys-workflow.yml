name: solar system workflow for deployment

on: 
   workflow_dispatch: 
   push:
    branches:
      - main
      - 'feature/*'

env:
    MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
    MONGO_USERNAME: ${{vars.MONGO_USER}}
    MONGO_PASSWORD: ${{secrets.MONGO_PASSWORD}}


jobs:
    unit-testing:      
        name: unit-testing
        strategy:
          matrix:
            nodejs_version: [18,20]
            operating_system: [ubuntu_latest]
        runs-on: ${{ matrix.operating_system }}
        steps:
        - name: checkout-repository
          uses: actions/checkout@v4

        - name: setup nodejs version - 18
          uses: actions/setup-node@v3
          with: 
            node-version: 18

        - name: Composite action - Cache & install NPM Packages
          uses: ./.github/workflows/custom-actions/npm-action
          with:
            path-of-folder: node-modules

        - name: Unit Testing
          run: npm test

        - name: archive test results
          uses: actions/upload-artifact@v4
          with: 
            name: Mocha-Test-Result
            path: test-results.xml

    code-coverage:
        name: Code Coverage
        strategy:
          matrix:
            nodejs_version: [18]
            operating_system: [ubuntu_latest]
        runs-on: ${{matrix.operating_system}}        
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

        - name: Setup NodeJS Version - 18
          uses: actions/setup-node@v3
          with:
            node-version: 18
        
        - name: Composite action - Cache & install NPM Packages
          uses: ./.github/workflows/custom-actions/npm-action
          with:
            path-of-folder: node-modules

        - name: Check Code Coverage
          continue-on-error: true
          run: npm run coverage

        - name: Archive Test Result
          uses: actions/upload-artifact@v4
          with:
            name: Code-Coverage-Result
            path: coverage
            rention-days: 5

    docker-image:
        name: Containerization
        needs: [unit-testing,code-coverage]
        runs-on: ubuntu-latest
        steps:
        - name: checkout-repository
          uses: actions/checkout@v4

        - name: DockerHub Login
          uses: docker/login-action@v3
          with:
            username: ${{ vars.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_PASSWORD }}

        - name: docker build for testing
          uses: docker/build-push-action@v6
          with:
            context: .     #context means , location of the docker file. 
            push: false #if true docker push is happening.
            tags: ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha}}

        - name: Docker Image Testing
          run: |
            docker images
            docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONOG_PASSWORD=$MONGO_USERNAME \
                ${{vars.DOCKERHUB_USERNAME}}/solar-system:${{ github.sha}}

            export IP=$(docker inspect -f '{{range.NetworkSetttings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
            echo $IP

            echo Testing image URL using wget
            wget -q -o - 127.0.0.1:3000/live | grep live
          


